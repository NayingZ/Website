<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 302" width="680" height="302" role="img"
     aria-label="The course of genetic disease, shown as five stages in sequence: screening and ascertainment, deep phenotyping, genomic testing and interpretation, counseling and cascade testing, and targeted therapy and surveillance. Above the sequence, a note reads that my doctoral research on population-level cancer clustering and genetic susceptibility across California aims to inform, with four arrows pointing to screening and ascertainment, genomic testing and interpretation, counseling and cascade testing, and targeted therapy and surveillance. Below the sequence, a feedback loop shows periodic reanalysis of unsolved cases returning to the testing and interpretation stage.">

  <!-- ===========================================================
       Naying Zhou — care continuum diagram
       Palette matches style.css:
         accent #1e3a5f · accent-soft #e8eef5 · ink #1a1a1a
         muted #6b6b6b · rule #e5e5e0 · bg #fdfdfb

       Structure: the five clinical stages run left to right.
       A note above shows where my research feeds in; a note
       below shows reanalysis feeding back. Both use dashed
       marching connectors to read as ongoing inputs rather
       than steps in the sequence.

       The five stages illuminate in turn on a 10-second loop
       (2s each), with each hand-off arrow brightening just
       before the next stage lights.

       All animation is pure CSS inside the SVG, so it runs when
       the file is embedded with an img tag, with no JavaScript,
       and is disabled for visitors who prefer reduced motion.
       =========================================================== -->

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#1e3a5f" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrowMuted" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#6b6b6b" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <style>
    .serif { font-family: "Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif; }
    .sans  { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    .band  { font-size: 10.5px; fill: #6b6b6b; letter-spacing: 1.6px; }
    .container { fill: none; stroke: #e5e5e0; stroke-width: 1; stroke-dasharray: 4 4; }
    .note { fill: #fdfdfb; stroke: #6b6b6b; stroke-width: 0.5; stroke-dasharray: 3 3; }
    .note-text { font-size: 11.5px; fill: #6b6b6b; }

    /* five stages, illuminating in sequence */
    .st rect {
      fill: #ffffff; stroke: #1e3a5f; stroke-width: 0.5;
      animation: stageOn 10s ease-in-out infinite;
    }
    .st text {
      font-size: 11.5px; fill: #1a1a1a;
      animation: stageText 10s ease-in-out infinite;
    }
    .s2 rect, .s2 text { animation-delay: 2s; }
    .s3 rect, .s3 text { animation-delay: 4s; }
    .s4 rect, .s4 text { animation-delay: 6s; }
    .s5 rect, .s5 text { animation-delay: 8s; }

    @keyframes stageOn {
      0%, 1%    { fill: #ffffff; }
      4%, 17%   { fill: #1e3a5f; }
      20%, 100% { fill: #ffffff; }
    }
    @keyframes stageText {
      0%, 1%    { fill: #1a1a1a; }
      4%, 17%   { fill: #ffffff; }
      20%, 100% { fill: #1a1a1a; }
    }

    /* hand-off arrows, brightening between stages */
    .arr {
      stroke: #1e3a5f; stroke-width: 1; fill: none; opacity: 0.25;
      animation: arrowOn 10s ease-in-out infinite;
    }
    .a1 { animation-delay: 1.6s; }
    .a2 { animation-delay: 3.6s; }
    .a3 { animation-delay: 5.6s; }
    .a4 { animation-delay: 7.6s; }

    @keyframes arrowOn {
      0%, 2%    { opacity: 0.25; }
      6%, 13%   { opacity: 1; }
      17%, 100% { opacity: 0.25; }
    }

    /* dashed inputs: research feeding in, reanalysis feeding back */
    .feed {
      stroke: #6b6b6b; stroke-width: 1; fill: none;
      stroke-dasharray: 3 3;
      animation: march 0.9s linear infinite;
    }
    .f2 { animation-delay: 0.22s; }
    .f3 { animation-delay: 0.44s; }
    .f4 { animation-delay: 0.66s; }
    @keyframes march { to { stroke-dashoffset: -6; } }

    @media (prefers-reduced-motion: reduce) {
      .st rect, .st text, .arr, .feed { animation: none; }
      .arr { opacity: 0.8; }
    }
  </style>

  <rect x="0" y="0" width="680" height="302" fill="#fdfdfb"/>

  <text class="sans band" x="16" y="28">ACROSS THE COURSE OF GENETIC DISEASE</text>
  <rect class="container" x="8" y="36" width="664" height="246" rx="6"/>

  <!-- ===== research input, above ===== -->
  <rect class="note" x="110" y="52" width="460" height="44" rx="22"/>
  <text class="sans note-text" x="340" y="71" text-anchor="middle">My doctoral research on population-level cancer clustering</text>
  <text class="sans note-text" x="340" y="87" text-anchor="middle">and genetic susceptibility across California aims to inform</text>

  <line class="feed f1" x1="180" y1="96" x2="76"  y2="128" marker-end="url(#arrowMuted)"/>
  <line class="feed f2" x1="300" y1="96" x2="338" y2="128" marker-end="url(#arrowMuted)"/>
  <line class="feed f3" x1="400" y1="96" x2="470" y2="128" marker-end="url(#arrowMuted)"/>
  <line class="feed f4" x1="500" y1="96" x2="604" y2="128" marker-end="url(#arrowMuted)"/>

  <!-- ===== five stages ===== -->
  <g class="st s1">
    <rect x="15" y="132" width="114" height="70" rx="4"/>
    <text class="serif" x="72" y="161" text-anchor="middle">Screening &amp;</text>
    <text class="serif" x="72" y="179" text-anchor="middle">Ascertainment</text>
  </g>
  <g class="st s2">
    <rect x="149" y="132" width="114" height="70" rx="4"/>
    <text class="serif" x="206" y="161" text-anchor="middle">Deep</text>
    <text class="serif" x="206" y="179" text-anchor="middle">Phenotyping</text>
  </g>
  <g class="st s3">
    <rect x="283" y="132" width="114" height="70" rx="4"/>
    <text class="serif" x="340" y="161" text-anchor="middle">Genomic Testing</text>
    <text class="serif" x="340" y="179" text-anchor="middle">&amp; Interpretation</text>
  </g>
  <g class="st s4">
    <rect x="417" y="132" width="114" height="70" rx="4"/>
    <text class="serif" x="474" y="161" text-anchor="middle">Counseling &amp;</text>
    <text class="serif" x="474" y="179" text-anchor="middle">Cascade Testing</text>
  </g>
  <g class="st s5">
    <rect x="551" y="132" width="114" height="70" rx="4"/>
    <text class="serif" x="608" y="161" text-anchor="middle">Targeted Therapy</text>
    <text class="serif" x="608" y="179" text-anchor="middle">&amp; Surveillance</text>
  </g>

  <!-- ===== hand-off arrows ===== -->
  <line class="arr a1" x1="129" y1="167" x2="149" y2="167" marker-end="url(#arrow)"/>
  <line class="arr a2" x1="263" y1="167" x2="283" y2="167" marker-end="url(#arrow)"/>
  <line class="arr a3" x1="397" y1="167" x2="417" y2="167" marker-end="url(#arrow)"/>
  <line class="arr a4" x1="531" y1="167" x2="551" y2="167" marker-end="url(#arrow)"/>

  <!-- ===== reanalysis feedback loop, below ===== -->
  <rect class="note" x="180" y="236" width="320" height="30" rx="15"/>
  <text class="sans note-text" x="340" y="255" text-anchor="middle">Periodic reanalysis of unsolved cases</text>
  <line class="feed" x1="340" y1="234" x2="340" y2="206" marker-end="url(#arrowMuted)"/>
</svg>
