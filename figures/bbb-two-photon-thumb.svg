<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 244 178" width="244" height="178" role="img" aria-label="Schematic: tracer confined to the vessel in sham mice, leaking into tissue 30 to 60 minutes after occlusion." xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<style>
  .s { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
  .tm { font-size: 9px; fill: #6b6b6b; }
</style>
<defs>
  <radialGradient id="lk" cx="50%" cy="50%" r="50%">
    <stop offset="0%" stop-color="#c0575a" stop-opacity="0.42"/>
    <stop offset="100%" stop-color="#c0575a" stop-opacity="0"/>
  </radialGradient>
</defs>
<rect width="244" height="178" fill="#fdfdfb"/>
<text class="s" x="14" y="24" font-size="11.5" font-weight="600" fill="#1a1a1a">Barrier leak, 30&#8211;60 min</text>
<text class="s" x="14" y="39" font-size="11.5" font-weight="600" fill="#1a1a1a">after occlusion</text>
<line x1="14" y1="50" x2="230" y2="50" stroke="#e5e5e0" stroke-width="1"/>

<text class="s tm" x="18" y="72">Sham</text>
<path d="M18,94 C70,82 150,104 226,92" stroke="#1e3a5f" stroke-width="8" fill="none" stroke-linecap="round"/>
<circle cx="88" cy="89" r="3.4" fill="#fdfdfb"/>
<circle cx="168" cy="98" r="3.4" fill="#fdfdfb"/>

<text class="s tm" x="18" y="128">Occluded</text>
<ellipse cx="86" cy="150" rx="52" ry="26" fill="url(#lk)"/>
<ellipse cx="176" cy="152" rx="44" ry="22" fill="url(#lk)"/>
<path d="M18,150 C70,138 150,160 226,148" stroke="#1e3a5f" stroke-width="8" fill="none" stroke-linecap="round" stroke-dasharray="18 6"/>
<circle cx="96" cy="145" r="3.4" fill="#fdfdfb"/>
<circle cx="120" cy="148" r="3.4" fill="#fdfdfb"/>
</svg>
