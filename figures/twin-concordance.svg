<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 372" width="700" height="372" role="img" aria-label="Bar chart of leukemia concordance among California twin pairs: 0.8 percent observed and 2.6 percent adjusted for all leukemia, 0.5 and 1.4 percent for lymphoid leukemia, 2.9 and 16.7 percent for AML, all below the 5 to 25 percent reported in earlier twin series." xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<rect width="700" height="372" fill="#fdfdfb"/>
<text x="28" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14.5" font-weight="600" fill="#1a1a1a">Twin concordance for leukemia is lower than long assumed</text>
<text x="28" y="58" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" fill="#6b6b6b">255 California twin pairs with at least one leukemia diagnosis, 1988–2022</text>
<line x1="28" y1="72" x2="672" y2="72" stroke="#e5e5e0" stroke-width="1"/>
<rect x="74" y="106.4" width="586" height="143.7" fill="#e8eef5" opacity="0.8"/>
