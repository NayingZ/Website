<line x1="74" y1="250.1" x2="660" y2="250.1" stroke="#7d97b5" stroke-width="1" stroke-dasharray="4 3"/>
<text x="84" y="123.6" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" fill="#7d97b5">5–25% reported in earlier twin series</text>
<line x1="74" y1="286" x2="660" y2="286" stroke="#6b6b6b" stroke-width="1"/>
<line x1="70" y1="286.0" x2="74" y2="286.0" stroke="#6b6b6b" stroke-width="1"/>
<text x="66" y="290.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" fill="#6b6b6b" text-anchor="end">0%</text>
<line x1="70" y1="250.1" x2="74" y2="250.1" stroke="#6b6b6b" stroke-width="1"/>
<text x="66" y="254.1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" fill="#6b6b6b" text-anchor="end">5%</text>
<line x1="70" y1="214.1" x2="74" y2="214.1" stroke="#6b6b6b" stroke-width="1"/>
