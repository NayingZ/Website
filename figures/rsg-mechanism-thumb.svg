<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 244 178" width="244" height="178" role="img" aria-label="Schematic: tPA after stroke causes hemorrhage; rosiglitazone acting through PPAR-gamma shifts microglia and preserves the barrier." xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<style>
  .s { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
  .t { font-size: 10px; fill: #1a1a1a; }
  .tm { font-size: 8.5px; fill: #6b6b6b; }
</style>
<defs>
  <marker id="ta" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto">
    <path d="M0,0 L10,5 L0,10 z" fill="#6b6b6b"/>
  </marker>
</defs>
<rect width="244" height="178" fill="#fdfdfb"/>
<text class="s" x="14" y="24" font-size="11.5" font-weight="600" fill="#1a1a1a">tPA hemorrhage after</text>
<text class="s" x="14" y="39" font-size="11.5" font-weight="600" fill="#1a1a1a">stroke</text>
<line x1="14" y1="50" x2="230" y2="50" stroke="#e5e5e0" stroke-width="1"/>

<rect x="16" y="64" width="96" height="34" rx="4" fill="#fbf1f1" stroke="#c98b8b"/>
<text class="s t" x="64" y="79" text-anchor="middle">tPA alone</text>
<text class="s tm" x="64" y="92" text-anchor="middle">barrier leaks</text>

<rect x="132" y="64" width="96" height="34" rx="4" fill="#e8eef5" stroke="#1e3a5f"/>
<text class="s t" x="180" y="79" text-anchor="middle">+ rosiglitazone</text>
<text class="s tm" x="180" y="92" text-anchor="middle">barrier holds</text>

<rect x="16" y="112" width="212" height="46" rx="4" fill="#ffffff" stroke="#e5e5e0"/>
<text class="s tm" x="122" y="129" text-anchor="middle">PPAR-&#947; &#8594; microglia: iNOS &#8595;</text>
<text class="s tm" x="122" y="145" text-anchor="middle">CD206, Arg-1 &#8593;</text>
<line x1="122" y1="100" x2="122" y2="110" stroke="#6b6b6b" stroke-width="1.2" marker-end="url(#ta)"/>
</svg>
