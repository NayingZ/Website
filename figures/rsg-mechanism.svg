<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 372" width="700" height="372" role="img" aria-label="Schematic: after stroke, delayed tPA thrombolysis breaks down the blood-brain barrier and causes hemorrhage. Rosiglitazone activates PPAR-gamma, shifting microglia from an iNOS-high state toward CD206 and Arg-1 expression, preserving the barrier and reducing hemorrhage. The PPAR-gamma antagonist GW9662 abolishes the effect." xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<style>
  .s { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
  .box { fill: #ffffff; stroke: #e5e5e0; stroke-width: 1; }
  .boxa { fill: #e8eef5; stroke: #1e3a5f; stroke-width: 1; }
  .harm { fill: #fbf1f1; stroke: #c98b8b; stroke-width: 1; }
  .t { font-size: 12.5px; fill: #1a1a1a; }
  .tm { font-size: 11px; fill: #6b6b6b; }
  .arrow { stroke: #6b6b6b; stroke-width: 1.4; fill: none; }
</style>
<defs>
  <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
    <path d="M0,0 L10,5 L0,10 z" fill="#6b6b6b"/>
  </marker>
  <marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
    <path d="M0,0 L10,5 L0,10 z" fill="#1e3a5f"/>
  </marker>
</defs>
<rect width="700" height="372" fill="#fdfdfb"/>
<text class="s" x="28" y="38" font-size="14.5" font-weight="600" fill="#1a1a1a">Rosiglitazone limits tPA-induced hemorrhage via PPAR-&#947;</text>
<text class="s tm" x="28" y="58">Mouse middle cerebral artery occlusion, tPA given 2 h after onset</text>
<line x1="28" y1="72" x2="672" y2="72" stroke="#e5e5e0" stroke-width="1"/>

<rect class="box" x="34" y="104" width="150" height="56" rx="5"/>
<text class="s t" x="109" y="128" text-anchor="middle">Ischemic stroke</text>
<text class="s tm" x="109" y="146" text-anchor="middle">MCAO</text>

<rect class="box" x="34" y="188" width="150" height="56" rx="5"/>
<text class="s t" x="109" y="212" text-anchor="middle">Delayed tPA</text>
<text class="s tm" x="109" y="230" text-anchor="middle">thrombolysis at 2 h</text>

<line class="arrow" x1="109" y1="160" x2="109" y2="184" marker-end="url(#a)"/>
<line class="arrow" x1="184" y1="216" x2="272" y2="216" marker-end="url(#a)"/>

<rect class="harm" x="274" y="176" width="164" height="80" rx="5"/>
<text class="s t" x="356" y="202" text-anchor="middle">Barrier breakdown</text>
<text class="s t" x="356" y="222" text-anchor="middle">&amp; brain hemorrhage</text>
<text class="s tm" x="356" y="242" text-anchor="middle">larger infarct at day 1</text>

<rect class="boxa" x="274" y="92" width="164" height="60" rx="5"/>
<text class="s t" x="356" y="116" text-anchor="middle">Rosiglitazone</text>
<text class="s tm" x="356" y="134" text-anchor="middle">PPAR-&#947; agonist, 6 mg/kg</text>

<line class="arrow" x1="356" y1="152" x2="356" y2="170" stroke="#1e3a5f"/>
<line class="arrow" x1="343" y1="170" x2="369" y2="170" stroke="#1e3a5f" stroke-width="2.6"/>
<text class="s tm" x="378" y="167" fill="#1e3a5f">prevents</text>

<line class="arrow" x1="438" y1="122" x2="506" y2="122" stroke="#1e3a5f" marker-end="url(#b)"/>
<rect class="boxa" x="508" y="92" width="158" height="60" rx="5"/>
<text class="s t" x="587" y="116" text-anchor="middle">Microglia shift</text>
<text class="s tm" x="587" y="134" text-anchor="middle">iNOS &#8595; &#183; CD206, Arg-1 &#8593;</text>

<line class="arrow" x1="587" y1="152" x2="587" y2="180" stroke="#1e3a5f" marker-end="url(#b)"/>
<rect class="box" x="508" y="182" width="158" height="74" rx="5"/>
<text class="s t" x="587" y="208" text-anchor="middle">Barrier preserved,</text>
<text class="s t" x="587" y="228" text-anchor="middle">less hemorrhage</text>
<text class="s tm" x="587" y="246" text-anchor="middle">smaller infarct</text>

<rect class="box" x="420" y="296" width="246" height="44" rx="5" stroke-dasharray="4 3"/>
<text class="s t" x="543" y="315" text-anchor="middle">GW9662 abolishes the protection</text>
<text class="s tm" x="543" y="332" text-anchor="middle">PPAR-&#947; antagonist &#8212; the effect runs through PPAR-&#947;</text>
<line class="arrow" x1="587" y1="296" x2="587" y2="278" stroke-dasharray="4 3"/>
<line class="arrow" x1="574" y1="276" x2="600" y2="276" stroke-width="2.4"/>
</svg>
