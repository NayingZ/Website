<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 372" width="700" height="372" role="img" aria-label="Schematic of two-photon in vivo imaging: in sham mice the TMR tracer stays inside the vessel and neutrophils move quickly; 30 to 60 minutes after middle cerebral artery occlusion the tracer leaks into the surrounding tissue and neutrophils slow down." xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<style>
  .s { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
  .t { font-size: 12.5px; fill: #1a1a1a; }
  .tm { font-size: 11px; fill: #6b6b6b; }
  .panel { fill: #ffffff; stroke: #e5e5e0; stroke-width: 1; }
</style>
<defs>
  <radialGradient id="leak" cx="50%" cy="50%" r="50%">
    <stop offset="0%" stop-color="#c0575a" stop-opacity="0.40"/>
    <stop offset="100%" stop-color="#c0575a" stop-opacity="0"/>
  </radialGradient>
  <marker id="v" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
    <path d="M0,0 L10,5 L0,10 z" fill="#6b6b6b"/>
  </marker>
</defs>
<rect width="700" height="372" fill="#fdfdfb"/>
<text class="s" x="28" y="38" font-size="14.5" font-weight="600" fill="#1a1a1a">Barrier leak is already visible 30&#8211;60 min after occlusion</text>
<text class="s tm" x="28" y="58">Two-photon imaging through a cranial window, 12 mice; TMR tracer and rhodamine-labelled neutrophils</text>
<line x1="28" y1="72" x2="672" y2="72" stroke="#e5e5e0" stroke-width="1"/>

<!-- sham panel -->
<rect class="panel" x="34" y="94" width="300" height="180" rx="5"/>
<text class="s t" x="52" y="118">Sham</text>
<text class="s tm" x="52" y="136">tracer stays in the vessel</text>
<path d="M56,206 C120,182 200,226 312,198" stroke="#1e3a5f" stroke-width="17" fill="none" stroke-linecap="round" opacity="0.16"/>
<path d="M56,206 C120,182 200,226 312,198" stroke="#1e3a5f" stroke-width="9" fill="none" stroke-linecap="round"/>
<circle cx="120" cy="195" r="4.5" fill="#fdfdfb"/>
<circle cx="196" cy="207" r="4.5" fill="#fdfdfb"/>
<circle cx="262" cy="205" r="4.5" fill="#fdfdfb"/>
<line x1="262" y1="230" x2="308" y2="230" stroke="#6b6b6b" stroke-width="1.4" marker-end="url(#v)"/>
<text class="s tm" x="196" y="252" text-anchor="middle">neutrophils rolling freely</text>

<!-- MCAO panel -->
<rect class="panel" x="366" y="94" width="300" height="180" rx="5"/>
<text class="s t" x="384" y="118">60 min occlusion, reperfused</text>
<text class="s tm" x="384" y="136">TMR escapes into the tissue</text>
<ellipse cx="470" cy="200" rx="74" ry="46" fill="url(#leak)"/>
<ellipse cx="590" cy="205" rx="58" ry="38" fill="url(#leak)"/>
<path d="M388,206 C452,182 532,226 644,198" stroke="#1e3a5f" stroke-width="17" fill="none" stroke-linecap="round" opacity="0.16"/>
<path d="M388,206 C452,182 532,226 644,198" stroke="#1e3a5f" stroke-width="9" fill="none" stroke-linecap="round" stroke-dasharray="26 7"/>
<circle cx="452" cy="196" r="4.5" fill="#fdfdfb"/>
<circle cx="528" cy="209" r="4.5" fill="#fdfdfb"/>
<circle cx="548" cy="211" r="4.5" fill="#fdfdfb"/>
<line x1="548" y1="230" x2="566" y2="230" stroke="#6b6b6b" stroke-width="1.4" marker-end="url(#v)"/>
<text class="s tm" x="528" y="252" text-anchor="middle">neutrophils slowed</text>

<text class="s tm" x="34" y="306">Extravascular TMR fluorescence</text>
<text class="s t" x="34" y="326" fill="#1e3a5f">increased after occlusion &#183; <tspan font-style="italic">P</tspan> &lt; .001</text>
<text class="s tm" x="366" y="306">Intravascular neutrophil velocity</text>
<text class="s t" x="366" y="326" fill="#1e3a5f">slower after occlusion &#183; <tspan font-style="italic">P</tspan> &lt; .001</text>
</svg>
